[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-multimodal-decision-support"
version = "0.1.0"
description = "A local, research-only medical AI workflow prototype; synthetic structured-data demo by default."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps.api.app*", "ml*", "rag*"]
